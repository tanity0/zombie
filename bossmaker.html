<!doctype html>
<!--
  ボスメーカー(開発用ツール)のエントリ。BOSS_MAKER.md §19。

  ★このファイルは `index.html` のコピーである(<title> と <script src> と下のインライン script だけが違う)。
    index.html は safe-area 変数・touch-action・スクロールバー抑止・--game-font・#root の 100% を
    **直書きの <style> で持っている**。これを共有CSSへ移すと本編の初期表示のタイミングが変わるため、
    あえてコピーにしてある = **二重管理**。index.html の <style> を直したら、ここにも同じ手を入れること。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon / iOSホーム画面アイコン。/zombie/ 配下でも壊れないよう相対パス指定。 -->
    <link rel="icon" type="image/jpeg" href="app-icon.jpg" />
    <link rel="apple-touch-icon" href="app-icon.jpg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="the ONE" />
    <title>ボスメーカー — the ONE</title>
    <!-- ★起動クエリの注入(BOSS_MAKER.md §19-5-a)。**インライン classic script でなければならない。**
         部屋の判定 `const BOSS_MAKER = evParam('bossmaker')==='1'`(useGameLoop.ts)は
         **モジュールスコープ定数**なので、`src/tools/bossmaker/main.tsx` の中で history.replaceState
         しても手遅れになる(ESMは静的importを全部評価してからモジュール本体が走る)。
         `<script type="module">` は defer 相当 = このclassic scriptは必ずそれより先に走る。
         症状(やってしまった場合): 木や松明は消えるのに雑魚が湧き続け、相手のボスが1体も出ない。
         ※既に付いているクエリは**残してマージ**する(ゲームのメニューから ?class=… で飛べるように)。
         ※この組は `src/utils/bossTest.ts` の `bossMakerQuery()` と同一。
            ズレ検知は `src/tools/bossmaker/bossmakerEntry.test.ts` が機械的に見張っている。 -->
    <script>
      (function () {
        var need = {
          smoke: '1',
          stage: 'stage-1',
          nospawn: '1',
          bossmaker: '1',
          retry: '1',
          class: 'warrior'
        };
        var p = new URLSearchParams(window.location.search);
        var changed = false;
        for (var k in need) {
          if (!p.has(k)) { p.set(k, need[k]); changed = true; }
        }
        if (changed) {
          window.history.replaceState(null, '', window.location.pathname + '?' + p.toString());
        }
      })();
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      html, body {
        overscroll-behavior: none;
        /* none だと子のスクロール領域(メニュー等)が指で全くスクロールできない
           (touch-action は祖先チェーンで交差判定されるため)。pan-x/pan-y にすると
           子に付けた touch-action: pan-y が効く一方、pinch/ダブルタップ拡大は引き続き抑止。
           ゲーム面(canvas/ジョイスティック/操作層)は各要素が個別に touch-action:none を指定済み。 */
        touch-action: pan-x pan-y;
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0b0b12;
        color: #f5f5f7;
        font-family: var(--game-font, "Orbitron"), "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      button {
        font-family: inherit;
      }
      /* ネイティブ感: ブラウザ由来の挙動を全要素で抑止する。
         - touch-callout: 長押しで出る「画像を保存/コピー」シート(imgで顕著)を消す=web感の最大のバレ。
         - user-select: テキスト選択のハイライトを消す(ゲームに不要)。
         - user-drag: 画像のゴーストドラッグを消す。 */
      *, *::before, *::after {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
      }
      /* ネイティブ感: ブラウザのスクロールバーを隠す(スクロール自体は touch/drag で維持)。
         可視のスクロールバーは"webっぽさ"の元なので全要素で非表示にする。 */
      * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* 旧Edge/IE */
      }
      *::-webkit-scrollbar {            /* WebKit(iOS Safari/Chrome) */
        width: 0;
        height: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tools/bossmaker/main.tsx"></script>
  </body>
</html>
