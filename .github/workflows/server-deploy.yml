name: Server deploy

# 守護霊オンライン/待ち合わせのサーバ(server/・Cloudflare Worker)を自動で本番へ出す(社長指示2026-10-27「再デプロイわからん、簡単にして」)。
# - server/ か shared/(ブラウザとサーバが共有する許可リスト)が変わった push で自動。Actions 画面の「Run workflow」でも手動で出せる。
# - 認証は GitHub の Secrets(CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)だけ。未設定の間はテストだけ回して出さない(赤くしない)。
# - 手順は server/README.md の「本番反映」と同じ(D1 の移行 → デプロイ)。移行は済んだものを飛ばすので毎回流して安全。
on:
  push:
    branches: [claude/chat-context-continuity-saxlH]
    paths: ['server/**', 'shared/**', '.github/workflows/server-deploy.yml']
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: 鍵が未設定なら出さない
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため本番へは出していません(テストのみ)。"
      - name: D1 の移行
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply zombie-ghost-online --remote
      - name: デプロイ
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
