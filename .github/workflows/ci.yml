name: CI

# 静的検査(lint / 型 / build)とユニットテスト(vitest)を push と PR で回す。
# デプロイ(pages.yml)とは独立。ここが緑であることをマージ前ゲートにする想定。
on:
  push:
  pull_request:

# 同一ブランチの古い実行は新しい push が来たらキャンセル(無駄な並走を防ぐ)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
