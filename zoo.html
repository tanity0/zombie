<!doctype html>
<!--
  敵モーション動物園(開発用ビューア)。v0.25.2903。
  何もない空間に全ての敵の見た目を並べ、本編と同じモーション(src/pixi/enemyMotion.ts)で
  うろうろさせて眺めるだけのページ。ゲーム本体(store/useGameLoop/pixiScene)は一切importしない。
  開き方: dev = http://localhost:5173/zombie/zoo.html / Pages = <base>/zoo.html
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="app-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b12" />
    <title>敵モーション動物園 — the ONE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16161d; overflow: hidden; }
      #field { position: relative; width: 100vw; height: 100vh; }
      .zoo-e {
        position: absolute; left: 0; top: 0;
        transform-origin: 50% 100%;
        image-rendering: pixelated;
        will-change: transform;
        pointer-events: none;
      }
      .zoo-label {
        position: absolute; left: 0; top: 0;
        color: #8b8b9e; font: 10px/1.2 monospace;
        white-space: nowrap; transform: translateX(-50%);
        pointer-events: none;
      }
      #hint { position: fixed; left: 8px; bottom: 6px; color: #55556a; font: 11px monospace; }
    </style>
  </head>
  <body>
    <div id="field"></div>
    <div id="hint">敵モーション動物園(開発用) — 眺めるだけ</div>
    <script type="module" src="/src/tools/zooViewer.ts"></script>
  </body>
</html>
