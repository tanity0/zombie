<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon / iOSホーム画面アイコン。/zombie/ 配下でも壊れないよう相対パス指定。 -->
    <link rel="icon" type="image/jpeg" href="app-icon.jpg" />
    <link rel="apple-touch-icon" href="app-icon.jpg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="the ONE" />
    <title>the ONE</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      html, body {
        overscroll-behavior: none;
        /* none だと子のスクロール領域(メニュー等)が指で全くスクロールできない
           (touch-action は祖先チェーンで交差判定されるため)。pan-x/pan-y にすると
           子に付けた touch-action: pan-y が効く一方、pinch/ダブルタップ拡大は引き続き抑止。
           ゲーム面(canvas/ジョイスティック/操作層)は各要素が個別に touch-action:none を指定済み。 */
        touch-action: pan-x pan-y;
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0b0b12;
        color: #f5f5f7;
        font-family: var(--game-font, "Orbitron"), "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      button {
        font-family: inherit;
      }
      /* ネイティブ感: ブラウザ由来の挙動を全要素で抑止する。
         - touch-callout: 長押しで出る「画像を保存/コピー」シート(imgで顕著)を消す=web感の最大のバレ。
         - user-select: テキスト選択のハイライトを消す(ゲームに不要)。
         - user-drag: 画像のゴーストドラッグを消す。 */
      *, *::before, *::after {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
      }
      /* ネイティブ感: ブラウザのスクロールバーを隠す(スクロール自体は touch/drag で維持)。
         可視のスクロールバーは"webっぽさ"の元なので全要素で非表示にする。 */
      * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* 旧Edge/IE */
      }
      *::-webkit-scrollbar {            /* WebKit(iOS Safari/Chrome) */
        width: 0;
        height: 0;
        display: none;
      }
    </style>
    <!-- 起動の失敗を画面に出す(v0.25.5315・社長報告「スマホで一番最初からまっくら」)。
         スマホでは console が見えず、React が描く前に落ちると画面に何も残らない。ゲームが出るまでの間だけ、
         捕まえていない例外・スクリプトの読み込み失敗・15秒たっても画面が空、を赤字で下に出す。
         出たあと(#root に中身が入った後)は何もしない=いつものプレイには一切出ない。 -->
    <script>
      (function () {
        var shown = false;
        window.__bootStage = 'html';
        function booted() { var r = document.getElementById('root'); return !!(r && r.children.length); }
        var t0 = Date.now(), box = null, first = '';
        // 起動に要るファイル(main の script・modulepreload・css)が届いたか。届いた物は resource timing に載る。
        function files() {
          var want = [], els = document.querySelectorAll('script[type=module][src],link[rel=modulepreload],link[rel=stylesheet]');
          for (var i = 0; i < els.length; i++) want.push(els[i].src || els[i].href);
          var got = {}, es = performance.getEntriesByType ? performance.getEntriesByType('resource') : [];
          for (var j = 0; j < es.length; j++) got[es[j].name] = es[j];
          return want.map(function (u) {
            var e = got[u], n = u.split('/').pop().split('?')[0];
            return (e ? '届いた ' + Math.round(e.duration / 100) / 10 + '秒 ' + (e.transferSize ? Math.round(e.transferSize / 1024) + 'KB' : e.decodedBodySize ? '(端末の保存分)' : '(中身なし)') : '未着') + ' ' + n;
          }).join('\n');
        }
        function paint() {
          if (!box) return;
          if (booted()) { box.remove(); box = null; return; }
          box.textContent = '起動エラー(段階: ' + window.__bootStage + ' / ' + Math.round((Date.now() - t0) / 1000) + '秒)\n' + first +
            '\n' + files() + '\n' + navigator.userAgent;
        }
        function show(msg) {
          if (shown) return; shown = true; first = msg;
          box = document.createElement('div');
          box.id = 'boot-diag';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2147483647;' +
            'font:12px/1.45 monospace;color:#ff7070;background:rgba(0,0,0,.88);padding:8px 10px;white-space:pre-wrap;word-break:break-all;pointer-events:none';
          (document.body || document.documentElement).appendChild(box);
          paint();
          // 届くのが遅いだけなのか止まっているのかを見分けるため、映るまで毎秒書き直す(映ったら消える)。
          var iv = setInterval(function () { paint(); if (!box) clearInterval(iv); }, 1000);
        }
        window.addEventListener('error', function (e) {
          if (booted()) return;
          var t = e.target, src = t && t !== window ? (t.src || t.href || '') : '';
          if (src) { if (/\.(js|mjs|css)(\?|$)/.test(src)) show('読み込み失敗: ' + src.slice(-90)); return; }
          var f = (e.filename || '').split('/').pop();
          show((e.message || String(e.error)) + (f ? ' @' + f + ':' + e.lineno + ':' + e.colno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (booted()) return;
          var r = e.reason; show('promise: ' + (r && r.message ? r.message : String(r)));
        });
        setTimeout(function () { if (!booted()) show('15秒たっても画面が出ていません'); }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
